<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font-family: -apple-system, system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
  #sidebar { width: 300px; padding: 20px; border-right: 1px solid #1f2b45; overflow-y: auto; }
  #chat { flex: 1; display: flex; flex-direction: column; padding: 20px; min-width: 0; }
  h1 { margin: 0 0 16px; font-size: 20px; letter-spacing: 3px; color: #4cc9f0; }
  h3 { margin: 20px 0 8px; font-size: 14px; color: #8fa3c7; }
  .event { padding: 8px 10px; margin-bottom: 6px; background: #131d33; border-left: 3px solid #4cc9f0; border-radius: 4px; font-size: 14px; }
  .empty { color: #5b6b8c; font-size: 14px; margin: 0; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1d4ed8; }
  .bot { align-self: flex-start; background: #131d33; }
  #bar { display: flex; gap: 10px; margin-top: 14px; }
  #input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #1f2b45; background: #0f1830; color: inherit; font-size: 15px; }
  button { padding: 0 20px; border: 0; border-radius: 8px; background: #4cc9f0; color: #0b1220; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>JARVIS</h1>
    <div id="events"></div>
  </div>
  <div id="chat">
    <div id="log"></div>
    <div id="bar">
      <input id="input" placeholder="Ask JARVIS something..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMessage(who, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage('user', text);
    const pending = addMessage('bot', 'Thinking...');
    sendBtn.disabled = true;
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();
      pending.textContent = data.reply;
    } catch (err) {
      pending.textContent = 'Error: ' + err.message;
    }
    sendBtn.disabled = false;
    input.focus();
    loadEvents();
  }

  function isoDate(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toLocaleDateString('en-CA');
  }

  async function loadEvents() {
    const panel = document.getElementById('events');
    panel.innerHTML = '';
    for (const [label, offset] of [['Today', 0], ['Tomorrow', 1]]) {
      const date = isoDate(offset);
      const res = await fetch('/events?date=' + date);
      const data = await res.json();
      const h = document.createElement('h3');
      h.textContent = label + ' - ' + date;
      panel.appendChild(h);
      if (data.events.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nothing scheduled';
        panel.appendChild(p);
      }
      for (const ev of data.events) {
        const row = document.createElement('div');
        row.className = 'event';
        row.textContent = ev.time + '  ' + ev.title;
        panel.appendChild(row);
      }
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  loadEvents();
  input.focus();
</script>
</body>
</html>
