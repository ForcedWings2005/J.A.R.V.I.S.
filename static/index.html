<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="stylesheet" href="/static/css/jarvis.css">
</head>
<body data-state="idle">
<div id="scrim"></div>

<header>
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="pills">
    <div class="pill">MODEL gemma4</div>
    <div class="pill">MIC <span id="mic-state">OFF</span></div>
    <div class="pill">VOICE MODE <button id="voice" role="switch" aria-checked="false" aria-label="Voice mode"></button></div>
    <div class="pill">REDUCE MOTION <button id="motion" role="switch" aria-checked="false" aria-label="Reduce motion"></button></div>
    <button class="pill" id="newchat" title="Forget this conversation and start again">NEW CONVERSATION</button>
  </div>
</header>

<div class="col">
  <div class="panel" tabindex="0"><div class="h"><span>TO-DO</span><span class="hint">EXPAND +</span></div><div id="tasks"></div></div>
  <div class="panel" tabindex="0"><div class="h"><span>CURRENT EVENTS</span><span class="hint">EXPAND +</span></div><div class="muted">Coming soon</div></div>
  <div class="panel" tabindex="0"><div class="h"><span>WEATHER</span><span class="hint">EXPAND +</span></div><div class="muted">Coming soon</div></div>
</div>

<div class="center">
  <svg id="orb" viewBox="0 0 460 460" role="img" aria-label="JARVIS orb"></svg>
  <div class="status" id="status">STANDING BY</div>
  <div class="tx">
    <div class="muted">YOU</div><div id="you">&nbsp;</div>
    <div class="muted" style="margin-top:10px">JARVIS</div><div id="bot">&nbsp;</div>
  </div>
  <div class="ticker" id="ticker">&nbsp;</div>
  <div id="confirm" role="alertdialog" aria-labelledby="confirm-text">
    <div><div class="warn">CONFIRM ACTION</div><div id="confirm-text"></div></div>
    <div class="btns">
      <button id="cancel" class="btn ghost">Cancel</button>
      <button id="ok" class="btn amber">Confirm</button>
    </div>
  </div>
  <div class="bar">
    <input id="input" placeholder="Type a command..." autocomplete="off" aria-label="Command">
    <button id="mic" aria-label="Microphone" title="Hold to talk, or tap to start and tap to stop">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="send">Send</button>
  </div>
  <div class="muted" id="hint"></div>
</div>

<div class="col">
    <div class="panel" id="sched-panel" tabindex="0"><div class="h"><span>SCHEDULE</span><span class="hint">EXPAND +</span></div><div id="sched"></div><div id="cal"></div></div>
  <div class="panel" tabindex="0"><div class="h"><span>SPORTS</span><span class="hint">EXPAND +</span></div><div class="muted">Coming soon</div></div>
  <div class="panel" tabindex="0"><div class="h"><span>NOTES AND MEMORY</span><span class="hint">EXPAND +</span></div><div class="muted">Coming soon</div></div>
</div>

<script src="/static/js/orb.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/tasks.js"></script>
<script src="/static/js/voice.js"></script>
<script src="/static/js/calendar.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
