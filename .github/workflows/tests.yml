name: tests

# Run on every push to any branch, and on pull requests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
